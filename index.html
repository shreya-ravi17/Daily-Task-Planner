<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Task Planner</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="fw-bold">Daily Task Planner</h1>
            <p id="currentDate" class="text-muted"></p>
        </div>

        <!-- Task Form -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">

                <form id="taskForm">
                    <div class="input-group">

                        <input
                            type="text"
                            id="taskInput"
                            class="form-control"
                            placeholder="Enter a task..."
                            autocomplete="off"
                        >

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Add Task
                        </button>

                    </div>

                    <div
                        id="errorMessage"
                        class="text-danger mt-2 d-none"
                    >
                        Please enter a task.
                    </div>
                </form>

            </div>
        </div>

        <!-- Filters -->
        <div class="d-flex justify-content-center gap-2 mb-4">

            <button
                class="btn btn-outline-primary filter-btn active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="btn btn-outline-primary filter-btn"
                data-filter="pending"
            >
                Pending
            </button>

            <button
                class="btn btn-outline-primary filter-btn"
                data-filter="completed"
            >
                Completed
            </button>

        </div>

        
        <div id="taskList"></div>

        
        <div
            id="emptyMessage"
            class="text-center text-muted py-4"
        >
            No tasks found.
        </div>

    </div>

    
    <script src="script.js"></script>

</body>
</html>
